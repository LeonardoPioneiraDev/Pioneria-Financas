name: pioneira-financas

services:
  postgres:
    image: postgres:16-alpine
    container_name: pioneira-financas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-pioneira}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-pioneira_dev}
      POSTGRES_DB: ${DATABASE_NAME:-pioneira_finance_db}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "${DATABASE_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-pioneira} -d ${DATABASE_NAME:-pioneira_finance_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pioneira-financas-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: pioneira-financas-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI (http://localhost:8025)

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pioneira-financas-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vpioneira.com.br
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "8080:80"
    depends_on:
      - postgres

  # =================== APLICAÇÃO ===================
  # Sobe junto com `docker compose --profile app up`.
  # Para subir só infra (postgres/redis/mailhog) use `docker compose up`.

  backend:
    build:
      context: .
      dockerfile: apps/FinancasBackend/Dockerfile
    image: pioneira/financas-backend:latest
    container_name: pioneira-financas-backend
    restart: unless-stopped
    profiles: ["app"]
    init: true   # init nativo do Docker (substitui tini, evita apt-get no build)
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 3333
      TRUST_PROXY: "true"
      # Postgres acessado pelo nome do serviço (rede interna do compose).
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-pioneira}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-pioneira_dev}
      DATABASE_NAME: ${DATABASE_NAME:-pioneira_finance_db}
      DATABASE_SCHEMA: public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (openssl rand -base64 64)}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Pioneira Finanças}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-nao-responda@vpioneira.com.br}
      APP_URL: ${APP_URL:-http://localhost:3001}
      # Sem isto, o backend só libera automaticamente IP de rede privada (RFC1918).
      # Só é obrigatório setar no .env.docker quando o acesso vier de um domínio público.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_EXCLUDED_PATHS: /health,/docs,/api/metrics/page-view
      # ⚠ Oracle/Globus: o Instant Client já está na imagem (ORACLE_CLIENT_PATH baked no Dockerfile).
      # Para habilitar: ORACLE_ENABLED=true + credenciais no .env — e o container precisa de
      # ROTA até o Oracle 10.0.1.191 (rede/VPN da empresa). Desligado por padrão.
      ORACLE_ENABLED: ${ORACLE_ENABLED:-false}
      # SEMPRE o caminho do CONTAINER (Linux). Nunca herda o ORACLE_CLIENT_PATH do .env (que é Windows p/ dev).
      ORACLE_CLIENT_PATH: /opt/oracle/instantclient
      ORACLE_HOST: ${ORACLE_HOST:-}
      ORACLE_PORT: ${ORACLE_PORT:-1521}
      ORACLE_SERVICE_NAME: ${ORACLE_SERVICE_NAME:-}
      ORACLE_USER: ${ORACLE_USER:-}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
      # Pool/timeouts — mesmo tuning do .env de dev (rede OCI lenta). Repassar explicitamente
      # em vez de confiar no default do código: se um dia divergirem, quebra em silêncio.
      ORACLE_POOL_MIN: ${ORACLE_POOL_MIN:-5}
      ORACLE_POOL_MAX: ${ORACLE_POOL_MAX:-50}
      ORACLE_POOL_INCREMENT: ${ORACLE_POOL_INCREMENT:-2}
      ORACLE_POOL_TIMEOUT: ${ORACLE_POOL_TIMEOUT:-18000000}
      ORACLE_CONNECT_TIMEOUT: ${ORACLE_CONNECT_TIMEOUT:-1800000}
      ORACLE_QUERY_TIMEOUT: ${ORACLE_QUERY_TIMEOUT:-18000000}
      ORACLE_FETCH_ARRAY_SIZE: ${ORACLE_FETCH_ARRAY_SIZE:-2000}
      ORACLE_PREFETCH_ROWS: ${ORACLE_PREFETCH_ROWS:-200}
      ORACLE_MAX_RETRIES: ${ORACLE_MAX_RETRIES:-3}
      ORACLE_RETRY_DELAY: ${ORACLE_RETRY_DELAY:-5000}
      EMPRESA_GLOBUS_ID: ${EMPRESA_GLOBUS_ID:-4}
      EMPRESA_GLOBUS_FILIAL: ${EMPRESA_GLOBUS_FILIAL:-1}
      EMPRESA_GLOBUS_FILIAIS: ${EMPRESA_GLOBUS_FILIAIS:-1,5,6,17,19}
      # Integração horarios.vpioneira.com.br — usada pelo sync "Receita TD Max (bilhetagem)".
      HORARIOS_ENABLED: ${HORARIOS_ENABLED:-false}
      HORARIOS_API_URL: ${HORARIOS_API_URL:-https://horarios.vpioneira.com.br}
      HORARIOS_API_KEY: ${HORARIOS_API_KEY:-}
      HORARIOS_TIMEOUT_MS: ${HORARIOS_TIMEOUT_MS:-30000}
      HORARIOS_MAX_RETRIES: ${HORARIOS_MAX_RETRIES:-3}
      HORARIOS_RETRY_DELAY_MS: ${HORARIOS_RETRY_DELAY_MS:-2000}
      # Chave que o sistema emite pra terceiros consumirem nosso endpoint receita:read.
      RECEITA_TDMAX_API_KEY: ${RECEITA_TDMAX_API_KEY:-}
    ports:
      - "${BACKEND_PORT_HOST:-3333}:3333"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/FinancasFrontend/Dockerfile
      args:
        # ⚠ NEXT_PUBLIC_* é "baked" no build do Next.js. Define no .env antes de buildar
        # ou passe via --build-arg.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3333}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Pioneira Finanças}
    image: pioneira/financas-frontend:latest
    container_name: pioneira-financas-frontend
    restart: unless-stopped
    profiles: ["app"]
    init: true   # init nativo do Docker
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo
      PORT: 3001
      HOSTNAME: 0.0.0.0
    ports:
      - "${FRONTEND_PORT_HOST:-3001}:3001"
    depends_on:
      - backend

volumes:
  postgres_data:
    name: pioneira-financas-postgres-data
  redis_data:
    name: pioneira-financas-redis-data
